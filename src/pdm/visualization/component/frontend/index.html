<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="./vendor/streamlit-component-lib.js"></script>
    <script src="./vendor/three.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #0b131d;
            color: #edf4fa;
            font-family: Inter, "Segoe UI", system-ui, sans-serif;
        }
        #stage {
            position: relative;
            width: 100%;
            background: #0b131d;
            overflow: hidden;
            border-radius: 14px;
            isolation: isolate;
        }
        #stage::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            border-radius: inherit;
            box-shadow: inset 0 0 80px #080d1555;
            border: 1px solid #26344788;
        }
        #canvas {
            width: 100%;
            height: 620px;
            display: block;
            background: #0b131d;
        }
        #hud {
            position: absolute;
            left: 20px;
            top: 18px;
            pointer-events: none;
            text-shadow: 0 1px 8px #000;
            font-size: 10px;
            letter-spacing: .025em;
            line-height: 1.45;
            max-width: calc(100% - 40px);
        }
        #hud-banner {
            color: #e8ba4a;
            font-weight: 600;
            margin-bottom: 4px;
        }
        #hud-line { color: #a9bfce; font-variant-numeric: tabular-nums; }
        #hud-hint { color: #728ba0; font-size: 10px; margin-top: 6px; }
        #hud-legend {
            position: absolute;
            bottom: 18px;
            left: 20px;
            right: 20px;
            white-space: pre-line;
            font-size: 10px;
            line-height: 1.8;
            color: #8fa3b7;
            padding-top: 14px;
            border-top: 1px solid #263447;
            pointer-events: none;
            text-shadow: 0 1px 5px #000;
        }
        #hud-legend::before {
            content: "";
            display: block;
            width: 92px;
            height: 3px;
            margin-bottom: 8px;
            border-radius: 3px;
            background: linear-gradient(90deg, #61d8ee, #28394a 50%, #f2be68);
        }
        #reset-view { position: absolute; right: 20px; bottom: 104px; font-size: 10px; }
        #controls {
            padding: 8px 12px 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            background: #0b131d;
            border-top: 1px solid #1a2430;
        }
        button {
            cursor: pointer;
            background: #132232;
            color: #b9d9e6;
            border: 1px solid #30485d;
            border-radius: 7px;
            padding: 7px 12px;
            transition: background .15s, border-color .15s;
        }
        button:hover { background: #1a3244; border-color: #61d8ee; }
        button:focus-visible { outline: 2px solid #61d8ee; outline-offset: 3px; }
        input[type="range"] { accent-color: #61d8ee; }
        @media (max-width: 480px) {
            #hud { left: 14px; right: 14px; max-width: none; }
            #hud-legend { left: 14px; right: 14px; font-size: 9px; }
        }
    </style>
</head>
<body>
    <div id="stage">
        <canvas id="canvas" aria-label="Fly connectome neural activity"></canvas>
        <div id="hud">
            <div id="hud-banner"></div>
            <div id="hud-line"></div>
            <div id="hud-hint">Drag to rotate · wheel to zoom · Play runs in this view</div>
        </div>
        <button id="reset-view" type="button">Fit brain</button>
        <div id="hud-legend"></div>
    </div>
    <div id="controls"></div>
    <script src="./main.js"></script>
</body>
</html>
