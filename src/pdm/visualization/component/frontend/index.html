<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="./vendor/streamlit-component-lib.js"></script>
    <script src="./vendor/three.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #04070c;
            color: #d7e4f0;
            font-family: "Segoe UI", system-ui, sans-serif;
        }
        #stage {
            position: relative;
            width: 100%;
            background: #04070c;
        }
        #canvas {
            width: 100%;
            height: 620px;
            display: block;
            background: #04070c;
        }
        #hud {
            position: absolute;
            left: 12px;
            top: 10px;
            pointer-events: none;
            text-shadow: 0 1px 8px #000;
            font-size: 12px;
            line-height: 1.45;
            max-width: 72%;
        }
        #hud-banner {
            color: #e8ba4a;
            font-weight: 600;
            margin-bottom: 4px;
        }
        #hud-line { color: #cfe6f5; }
        #hud-hint { color: #8aa0b5; font-size: 11px; margin-top: 4px; }
        #controls {
            padding: 8px 12px 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            background: #05070c;
            border-top: 1px solid #1a2430;
        }
        button {
            cursor: pointer;
            background: #14202c;
            color: #e8f2fa;
            border: 1px solid #2a3c4e;
            border-radius: 4px;
            padding: 4px 10px;
        }
        input[type="range"] { accent-color: #7ed0ea; }
    </style>
</head>
<body>
    <div id="stage">
        <canvas id="canvas"></canvas>
        <div id="hud">
            <div id="hud-banner"></div>
            <div id="hud-line"></div>
            <div id="hud-hint">Drag to rotate · wheel to zoom · Play runs in this view</div>
        </div>
    </div>
    <div id="controls"></div>
    <script src="./main.js"></script>
</body>
</html>
