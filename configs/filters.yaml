dataset_id: filters
display_name: Filters
source_name: HSE Preventive to Predictive Maintenance
source_url: https://www.kaggle.com/datasets/prognosticshse/preventive-to-predicitve-maintenance
kaggle_slug: prognosticshse/preventive-to-predicitve-maintenance
citation: >-
  Hagmeyer, S., Mauthe, F., & Zeiler, P. (2021). Creation of Publicly Available
  Data Sets for Prognostics and Diagnostics Addressing Data Scenarios Relevant
  to Industrial Applications. International Journal of Prognostics and Health
  Management, 12(2). DOI: 10.36001/ijphm.2021.v12i2.3087
license: CC BY 4.0

mode: filters_censored
# Evaluation (RUL): primary metric is the last sensor row of each author test
# prefix vs official_rul_at_prefix_end_s (eval-only; never a model input).
# All prefix points are a secondary backtest. Censored validation keeps NLL
# on all val units and MAE on observed 600 Pa events with their count.
# filters_full_history is not implemented. inspect probes Train_Data_Uncensored.mat
# (missing | unreadable | readable_needs_protocol) but never trains on it.
# Do not set mode to filters_full_history and do not invent MATLAB table fields.
pressure_limit_pa: 600.0
# Time/RUL unit compatibility is UNCONFIRMED. The source PDF does not name the
# Time column unit. CSV dt≈0.1; Sampling is documented in Hz.
# Frozen working assumption (not calibrated wall-clock minutes): treat original
# Time as minutes and convert with time_to_seconds=60 → timestamp_s.
# Seconds as the native unit would make a "replacement interval" of ~45 s;
# hours contradict dust-volume scale. CRAN degradr labels RUL as hours
# (conflict; not adopted). See reports/implementation_report.md
# (Filters / HSE; §7 Limitations). Do not promise alerts in real minutes.
# Changing time_to_seconds requires a new data version, window rebuild,
# retrain, and re-evaluation. Do not change this coefficient in-place.
original_time_unit: minutes  # assumed, unverified
time_to_seconds: 60.0
time_scale_verified: false
pressure_unit: Pa
dust_feed_unit: mm3/s

split:
  val_fraction: 0.20
  seed: 42
  stratify_events: true

model:
  architecture: gru
  history_length: 20
  hidden_size: 64
  recurrent_layers: 1
  dropout: 0.1
  batch_size: 32
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  max_epochs: 30
  early_stopping_patience: 5
  grad_clip: 1.0
  seed: 42
  num_workers: 0
  smoke_max_epochs: 5
  smoke_max_windows_per_unit: 32
  reservoir:
    n_nodes: 1000
    leak: 0.2
    spectral_radius: 0.9
    input_scale: 0.1
    ridge_alpha: 0.001
    seed: 42
    state_mode: window_reset
    graph_mode: synthetic_fixture

alerts:
  confirmation_count: 3
  reset_factor: 1.2
  horizon_fraction_of_median_train: 0.10
  # H_trigger aliases warning_horizon_s; default = rounded 10% of median train duration.
  minimum_action_lead_time_fraction: 0.5
  # max_useful_horizon_s: optional; omit or null = no too_early cap

gap:
  # Prepare parquet, build_windows, count_window_eligibility, replay, and predict
  # all use the same causal rule on prefix rows 0..t:
  #   gap[i] = delta_t_s[i] > gap_multiplier * median(delta_t_s[1:i])
  # Future timestamps never enter the median. Row 0 is never a gap.
  # When the prefix has no past Δt (i < 2) or that median is non-positive,
  # compare against sampling_interval_s.
  # Full-file median (causal=False) is a Data-screen diagnostic only and
  # must not decide train / val / eval / replay eligibility.
  # sampling_interval_s = CSV Time step 0.1 (assumed minutes) * time_to_seconds 60.
  # Internal 6 s interval on the assumed scale — not a verified wall-clock period.
  # Documented from CSV spacing, not a MATLAB field. Do not change time_to_seconds.
  gap_multiplier: 3.0
  sampling_interval_s: 6.0
  do_not_window_across_gap: true
