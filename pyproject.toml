[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-maintenance-lab"
version = "0.1.0"
description = "Local Predictive Maintenance Lab: XJTU-SY bearings and HSE filters"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Predictive Maintenance Lab" }]

[project.scripts]
pdm-lab = "pdm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pdm.visualization.component.frontend" = ["*.html", "*.js", "*.txt"]
"pdm.visualization.component.frontend.vendor" = ["*.js", "*.txt"]
"pdm.connectome.fixtures" = ["*.json", "*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
